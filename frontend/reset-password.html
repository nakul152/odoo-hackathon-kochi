<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="auth-wrap"><div class="auth-card">
  <h1>Set a new password</h1>
  <p class="sub">Password: 9+ characters, uppercase, lowercase and a special character</p>
  <form id="form">
    <label for="password">New password</label>
    <input id="password" type="password" required>
    <label for="confirm">Confirm password</label>
    <input id="confirm" type="password" required>
    <div id="msg" class="msg"></div>
    <button class="btn full" type="submit">Update password</button>
  </form>
</div></div>
<script src="/static/js/api.js"></script>
<script>
const token = new URLSearchParams(window.location.search).get("token");
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  const pw = document.getElementById("password").value;
  if (pw !== document.getElementById("confirm").value) {
    return showMessage(msg, "Passwords do not match", "error");
  }
  try {
    await api("/auth/reset-password", "POST", { token: token, new_password: pw });
    showMessage(msg, "Password updated! Redirecting to login...", "success");
    setTimeout(() => window.location.href = "/static/login.html", 1500);
  } catch (err) { showMessage(msg, err.messages, "error"); }
});
</script>
</body></html>
