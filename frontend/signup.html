<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="auth-wrap"><div class="auth-card">
  <h1>Create your account</h1>
  <p class="sub">Password: 9+ characters, uppercase, lowercase and a special character</p>
  <form id="form">
    <label for="name">Full name</label>
    <input id="name" required>
    <label for="email">Email</label>
    <input id="email" type="email" required>
    <label for="password">Password</label>
    <input id="password" type="password" required>
    <div id="msg" class="msg"></div>
    <button class="btn full" type="submit">Sign up</button>
  </form>
  <div class="auth-links"><a href="/static/login.html">Already have an account? Log in</a></div>
</div></div>
<script src="/static/js/api.js"></script>
<script>
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  try {
    await api("/auth/signup", "POST", {
      name: document.getElementById("name").value,
      email: document.getElementById("email").value,
      password: document.getElementById("password").value,
    });
    showMessage(msg, "Account created! Redirecting to login...", "success");
    setTimeout(() => window.location.href = "/static/login.html", 1200);
  } catch (err) { showMessage(msg, err.messages, "error"); }
});
</script>
</body></html>
