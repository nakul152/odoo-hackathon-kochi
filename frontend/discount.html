<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discounts</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .dsc-bar { background:#4f46e5; padding:12px 24px; display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
    .dsc-bar a { color:#fff; text-decoration:none; font-size:14px; }
    .dsc-bar a.on { font-weight:700; text-decoration:underline; }
    .dsc-bar .sp { margin-left:auto; }
    .dsc-main { max-width:1050px; margin:24px auto; padding:0 16px; display:grid; gap:20px; font-family:"Segoe UI",system-ui,sans-serif; }
    .dsc-card { background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:20px; }
    .dsc-card h2 { margin:0 0 12px; font-size:18px; }
    .dsc-row { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; }
    .dsc-row label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:#6b7280; }
    .dsc-row input, .dsc-row select { padding:8px 10px; border:1px solid #e5e7eb; border-radius:6px; font-size:14px; min-width:140px; }
    .dsc-btn { background:#4f46e5; color:#fff; border:0; border-radius:6px; padding:9px 16px; font-size:14px; cursor:pointer; }
    .dsc-btn.del { background:#fff; color:#b91c1c; border:1px solid #b91c1c; padding:4px 10px; font-size:12px; }
    .dsc-wrap { overflow-x:auto; }
    .dsc-table { width:100%; border-collapse:collapse; font-size:14px; }
    .dsc-table th, .dsc-table td { padding:10px 12px; text-align:left; border-bottom:1px solid #e5e7eb; white-space:nowrap; }
    .dsc-table th { color:#6b7280; font-size:12px; text-transform:uppercase; }
    .dsc-badge { padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; }
    .dsc-on { background:#dcfce7; color:#15803d; } .dsc-off { background:#f3f4f6; color:#4b5563; }
    .dsc-msg { padding:12px 16px; border-radius:8px; font-size:14px; display:none; }
    .dsc-msg.error { display:block; background:#fee2e2; color:#b91c1c; }
    .dsc-msg.success { display:block; background:#dcfce7; color:#15803d; }
    .dsc-hint { color:#6b7280; font-size:13px; margin:0 0 12px; }
  </style>
</head>
<body>
  <nav class="dsc-bar">
    <a href="/static/dashboard.html">Dashboard</a>
    <a href="/static/invoices.html">Invoices</a>
    <a href="/static/payments.html">Payments</a>
    <a href="/static/discounts.html" class="on">Discounts</a>
    <a href="#" id="logout" class="sp">Log out</a>
  </nav>

  <main class="dsc-main">
    <div id="msg" class="dsc-msg" role="alert"></div>

    <section class="dsc-card" id="form-card">
      <h2>New discount</h2>
      <p class="dsc-hint">A discount applies on the next invoice by itself, and stops when it expires or runs out. Choose a product or a whole subscription.</p>
      <form id="dsc-form" class="dsc-row">
        <label>Name <input id="d-name" maxlength="100" required></label>
        <label>Type
          <select id="d-type"><option value="percent">Percentage</option><option value="fixed">Fixed amount</option></select>
        </label>
        <label>Value <input id="d-value" type="number" min="0.01" step="0.01" required></label>
        <label>Min purchase <input id="d-minp" type="number" min="0" step="0.01" placeholder="0"></label>
        <label>Min quantity <input id="d-minq" type="number" min="0" step="1" placeholder="0"></label>
        <label>Start date <input id="d-start" type="date" required></label>
        <label>End date <input id="d-end" type="date"></label>
        <label>Usage limit <input id="d-limit" type="number" min="1" step="1" placeholder="unlimited"></label>
        <label>Applies to
          <select id="d-target"><option value="product">A product</option><option value="subscription">A subscription</option></select>
        </label>
        <label>Product / subscription ID <input id="d-target-id" type="number" min="1" step="1" required></label>
        <button class="dsc-btn" type="submit">Create discount</button>
      </form>
    </section>

    <section class="dsc-card">
      <h2>All discounts</h2>
      <div class="dsc-wrap" id="list"></div>
    </section>
  </main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (n) => Number(n).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const token = localStorage.getItem("token") || localStorage.getItem("access_token");
let user = null;
try { user = JSON.parse(localStorage.getItem("user")); } catch { /* ignore */ }
if (!token) location.replace("/static/login.html");
else if (user && user.role === "customer") location.replace("/static/portal.html");
const isAdmin = !!user && user.role === "admin";

function say(text, kind = "error") {
  const box = $("msg");
  box.textContent = text || "";
  box.className = "dsc-msg" + (text ? " " + kind : "");
  if (text) box.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function errorText(data, status) {
  if (data && typeof data.detail === "string") return data.detail;
  if (data && Array.isArray(data.detail)) {
    return data.detail.map((d) => typeof d === "string"
      ? d : `${(d.loc || []).slice(1).join(" ")}: ${d.msg}`).join("; ");
  }
  return `Something went wrong (code ${status})`;
}

async function call(path, method = "GET", body) {
  let res;
  try {
    res = await fetch(path, {
      method,
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch { throw new Error("Cannot reach the server. Is it running?"); }
  let data = null;
  try { data = await res.json(); } catch { /* empty reply */ }
  if (res.status === 401) {
    localStorage.removeItem("token");
    location.replace("/static/login.html");
    throw new Error("Please log in again");
  }
  if (!res.ok) throw new Error(errorText(data, res.status));
  return data;
}

function render(rows) {
  if (!rows.length) return '<p class="dsc-hint">No discounts yet.</p>';
  const body = rows.map((d) => {
    const value = d.type === "percent" ? `${Number(d.value)}%` : money(d.value);
    const target = d.product_id ? `Product #${d.product_id}` : `Subscription #${d.subscription_id}`;
    return `<tr>
      <td>${esc(d.name)}</td><td>${esc(value)}</td><td>${esc(target)}</td>
      <td>${money(d.min_purchase)} / ${d.min_quantity}</td>
      <td>${esc(d.start_date)} to ${esc(d.end_date || "no end")}</td>
      <td>${d.times_used} / ${d.usage_limit ?? "unlimited"}</td>
      <td><span class="dsc-badge ${d.is_active_now ? "dsc-on" : "dsc-off"}">${d.is_active_now ? "Active" : "Inactive"}</span></td>
      ${isAdmin ? `<td><button class="dsc-btn del" data-id="${d.id}">Delete</button></td>` : ""}
    </tr>`;
  }).join("");
  return `<table class="dsc-table"><thead><tr><th>Name</th><th>Value</th><th>Applies to</th>
    <th>Min purchase / qty</th><th>Dates</th><th>Used</th><th>Status</th>${isAdmin ? "<th></th>" : ""}</tr></thead>
    <tbody>${body}</tbody></table>`;
}

async function load() {
  try { $("list").innerHTML = render(await call("/billing/discounts")); }
  catch (err) { $("list").innerHTML = ""; say(err.message); }
}

document.addEventListener("DOMContentLoaded", () => {
  $("d-start").value = new Date().toISOString().slice(0, 10);
  if (!isAdmin) {
    $("form-card").style.display = "none";
    if (user) say("Only the admin can create or delete discounts. You can view them here.", "success");
  }

  $("logout").addEventListener("click", (e) => {
    e.preventDefault();
    localStorage.removeItem("token");
    localStorage.removeItem("user");
    location.href = "/static/login.html";
  });

  $("dsc-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    say("");
    const value = Number($("d-value").value);
    const type = $("d-type").value;
    const start = $("d-start").value, end = $("d-end").value;
    const targetId = parseInt($("d-target-id").value, 10);
    if (!$("d-name").value.trim()) return say("Enter a name for the discount.");
    if (!(value > 0)) return say("The value must be greater than zero.");
    if (type === "percent" && value > 100) return say("A percentage cannot be more than 100.");
    if (end && end < start) return say("The end date cannot be before the start date.");
    if (!(targetId >= 1)) return say("Enter the ID of the product or subscription.");

    const body = {
      name: $("d-name").value.trim(), type, value,
      min_purchase: Number($("d-minp").value || 0),
      min_quantity: parseInt($("d-minq").value || "0", 10),
      start_date: start,
    };
    if (end) body.end_date = end;
    if ($("d-limit").value) body.usage_limit = parseInt($("d-limit").value, 10);
    if ($("d-target").value === "product") body.product_id = targetId;
    else body.subscription_id = targetId;

    const button = e.target.querySelector("button");
    button.disabled = true;
    try {
      await call("/billing/discounts", "POST", body);
      say("Discount created.", "success");
      e.target.reset();
      $("d-start").value = new Date().toISOString().slice(0, 10);
      load();
    } catch (err) { say(err.message); }
    finally { button.disabled = false; }
  });

  $("list").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-id]");
    if (!btn || !window.confirm("Delete this discount?")) return;
    say("");
    try { await call("/billing/discounts/" + btn.dataset.id, "DELETE"); say("Discount deleted.", "success"); load(); }
    catch (err) { say(err.message); }
  });

  load();
});
</script>
</body>
</html>
