<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="auth-wrap"><div class="auth-card">
  <h1>Forgot password?</h1>
  <p class="sub">Enter your registered email and we'll send a reset link</p>
  <form id="form">
    <label for="email">Email</label>
    <input id="email" type="email" required>
    <div id="msg" class="msg"></div>
    <button class="btn full" type="submit">Send reset link</button>
  </form>
  <div class="auth-links"><a href="/static/login.html">Back to log in</a></div>
</div></div>
<script src="/static/js/api.js"></script>
<script>
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  try {
    const data = await api("/auth/forgot-password", "POST", { email: document.getElementById("email").value });
    showMessage(msg, data.message, "success");
  } catch (err) { showMessage(msg, err.messages, "error"); }
});
</script>
</body></html>
