<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discounts & Taxes | Brightloop</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/billing.css">
</head>
<body>
<div id="sidebar"></div>
<main class="main">
  <h1 class="page-title">Discounts &amp; Taxes</h1>
  <p class="page-sub">Set the rules once. Discounts and taxes then apply to invoices by themselves.</p>
  <div id="msg" class="msg"></div>

  <div class="card">
    <h2>Taxes</h2>
    <form id="tax-form" class="form-row">
      <div><label for="t-name">Name</label><input id="t-name" maxlength="50" placeholder="e.g. GST 18%" required></div>
      <div><label for="t-rate">Rate (%)</label><input id="t-rate" type="number" min="0" max="100" step="0.01" required></div>
      <button class="btn" type="submit">Add tax</button>
    </form>
    <div class="table-scroll" id="taxes" style="margin-top:14px"></div>
  </div>

  <div class="card">
    <h2>New discount</h2>
    <p class="hint">Applies to the next invoice automatically and stops when it expires or runs out. Choose a product or a whole subscription.</p>
    <form id="dsc-form" class="form-row">
      <div><label for="d-name">Name</label><input id="d-name" maxlength="100" required></div>
      <div><label for="d-type">Type</label>
        <select id="d-type"><option value="percent">Percentage</option><option value="fixed">Fixed amount</option></select></div>
      <div><label for="d-value">Value</label><input id="d-value" type="number" min="0.01" step="0.01" required></div>
      <div><label for="d-minp">Min purchase</label><input id="d-minp" type="number" min="0" step="0.01" placeholder="0"></div>
      <div><label for="d-minq">Min quantity</label><input id="d-minq" type="number" min="0" step="1" placeholder="0"></div>
      <div><label for="d-start">Start date</label><input id="d-start" type="date" required></div>
      <div><label for="d-end">End date</label><input id="d-end" type="date"></div>
      <div><label for="d-limit">Usage limit</label><input id="d-limit" type="number" min="1" step="1" placeholder="unlimited"></div>
      <div><label for="d-target">Applies to</label>
        <select id="d-target"><option value="product">A product</option><option value="subscription">A subscription</option></select></div>
      <div><label for="d-target-id">Product / subscription ID</label><input id="d-target-id" type="number" min="1" step="1" required></div>
      <button class="btn" type="submit">Create discount</button>
    </form>
  </div>

  <div class="card">
    <h2>All discounts</h2>
    <div class="table-scroll" id="list"></div>
  </div>
</main>

<script src="/static/js/api.js"></script>
<script src="/static/js/layout.js"></script>
<script src="/static/js/billing-common.js"></script>
<script>
initLayout("discounts.html");
const user = getUser();
if (user && user.role !== "admin") window.location.href = "/static/dashboard.html";

const $ = (id) => document.getElementById(id);
const msg = $("msg");

// ---------- taxes ----------
async function loadTaxes() {
  try {
    const rows = await api("/billing/taxes");
    $("taxes").innerHTML = rows.length
      ? `<table><thead><tr><th>Name</th><th class="num">Rate</th><th></th></tr></thead><tbody>` +
        rows.map((t) => `<tr><td>${esc(t.name)}</td><td class="num">${Number(t.rate)}%</td>
          <td><button class="btn danger small" data-tax="${Number(t.id)}">Switch off</button></td></tr>`).join("") +
        "</tbody></table>"
      : '<p class="empty">No taxes yet.</p>';
  } catch (err) { sayError(msg, err); }
}

$("tax-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearMsg(msg);
  const name = $("t-name").value.trim();
  const rate = Number($("t-rate").value);
  if (!name) return say(msg, "Enter a name for the tax.", "error");
  if (!(rate >= 0 && rate <= 100)) return say(msg, "The rate must be between 0 and 100.", "error");
  try {
    await api("/billing/taxes", "POST", { name, rate });
    say(msg, "Tax added.");
    e.target.reset();
    loadTaxes();
  } catch (err) { sayError(msg, err); }
});

$("taxes").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-tax]");
  if (!b || !confirm("Switch off this tax? Old invoices keep it.")) return;
  clearMsg(msg);
  try { await api("/billing/taxes/" + b.dataset.tax, "DELETE"); say(msg, "Tax switched off."); loadTaxes(); }
  catch (err) { sayError(msg, err); }
});

// ---------- discounts ----------
function renderDiscounts(rows) {
  if (!rows.length) return '<p class="empty">No discounts yet.</p>';
  const body = rows.map((d) => {
    const value = d.type === "percent" ? `${Number(d.value)}%` : money(d.value);
    const target = d.product_id ? `Product #${Number(d.product_id)}` : `Subscription #${Number(d.subscription_id)}`;
    const state = d.is_active_now ? '<span class="badge active">Active</span>' : '<span class="badge draft">Inactive</span>';
    return `<tr><td>${esc(d.name)}</td><td>${esc(value)}</td><td>${esc(target)}</td>
      <td>${money(d.min_purchase)} / ${Number(d.min_quantity)}</td>
      <td>${esc(d.start_date)} to ${esc(d.end_date || "no end")}</td>
      <td>${Number(d.times_used)} / ${d.usage_limit == null ? "unlimited" : Number(d.usage_limit)}</td>
      <td>${state}</td>
      <td><button class="btn danger small" data-del="${Number(d.id)}">Delete</button></td></tr>`;
  }).join("");
  return `<table><thead><tr><th>Name</th><th>Value</th><th>Applies to</th><th>Min purchase / qty</th>
    <th>Dates</th><th>Used</th><th>Status</th><th></th></tr></thead><tbody>${body}</tbody></table>`;
}

async function loadDiscounts() {
  try { $("list").innerHTML = renderDiscounts(await api("/billing/discounts")); }
  catch (err) { $("list").innerHTML = ""; sayError(msg, err); }
}

$("dsc-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearMsg(msg);
  const type = $("d-type").value;
  const value = Number($("d-value").value);
  const start = $("d-start").value, end = $("d-end").value;
  const targetId = parseInt($("d-target-id").value, 10);
  if (!$("d-name").value.trim()) return say(msg, "Enter a name for the discount.", "error");
  if (!(value > 0)) return say(msg, "The value must be greater than zero.", "error");
  if (type === "percent" && value > 100) return say(msg, "A percentage cannot be more than 100.", "error");
  if (end && end < start) return say(msg, "The end date cannot be before the start date.", "error");
  if (!(targetId >= 1)) return say(msg, "Enter the ID of the product or subscription.", "error");

  const body = {
    name: $("d-name").value.trim(), type, value,
    min_purchase: Number($("d-minp").value || 0),
    min_quantity: parseInt($("d-minq").value || "0", 10),
    start_date: start,
  };
  if (end) body.end_date = end;
  if ($("d-limit").value) body.usage_limit = parseInt($("d-limit").value, 10);
  if ($("d-target").value === "product") body.product_id = targetId;
  else body.subscription_id = targetId;

  const button = e.target.querySelector("button");
  button.disabled = true;
  try {
    await api("/billing/discounts", "POST", body);
    say(msg, "Discount created.");
    e.target.reset();
    $("d-start").value = todayLocal();
    loadDiscounts();
  } catch (err) { sayError(msg, err); }
  finally { button.disabled = false; }
});

$("list").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-del]");
  if (!b || !confirm("Delete this discount?")) return;
  clearMsg(msg);
  try { await api("/billing/discounts/" + b.dataset.del, "DELETE"); say(msg, "Discount deleted."); loadDiscounts(); }
  catch (err) { sayError(msg, err); }
});

$("d-start").value = todayLocal();
loadTaxes();
loadDiscounts();
</script>
</body>
</html>
